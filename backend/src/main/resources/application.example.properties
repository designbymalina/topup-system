# Application
spring.application.name=topup-system
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/topup_system
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

info.app.name=Prepaid Top-Up & Billing System
info.app.version=1.0.0
info.app.description=Prepaid top-up and billing system

# Security
app.bootstrap-admin.username=CHANGE_ME
app.bootstrap-admin.password=CHANGE_ME
security.jwt.secret=CHANGE_ME
